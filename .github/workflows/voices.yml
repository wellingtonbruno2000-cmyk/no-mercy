# Gera as vozes neurais (pt-BR) das frases do jogo e salva em client/public/voices.
# GitHub → aba Actions → "Gerar vozes" → Run workflow. Roda sozinho quando as frases mudam.
name: Gerar vozes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['shared/src/phrases.json', 'scripts/gen_voices.py']

permissions:
  contents: write

jobs:
  vozes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o gerador de voz (Piper) e o ffmpeg
        run: |
          pip install piper-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Gerar os áudios
        run: python scripts/gen_voices.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/voices
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Vozes neurais das frases (gerado automaticamente)"
          git push
